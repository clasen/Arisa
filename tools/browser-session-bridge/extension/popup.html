<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arisa Session Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <img class="mark" src="icons/icon-48.png" width="42" height="42" alt="Arisa">
      <div class="brand-copy">
        <h1>arisa<span>.session</span></h1>
        <p>browser bridge</p>
      </div>
      <span class="profile">dedicated profile</span>
    </header>

    <section id="setup" class="hidden">
      <div class="section-title"><span>&gt;</span> connect profile</div>
      <label for="setup-code">setup link detected automatically, or paste its code</label>
      <textarea id="setup-code" rows="3" spellcheck="false" placeholder="arisa-enroll://…"></textarea>
      <button id="connect" class="primary">connect this profile</button>
    </section>

    <section id="connected" class="hidden">
      <div class="connection">
        <div>
          <span class="state">connected</span>
          <small id="device-label"></small>
        </div>
        <button id="forget" class="link">forget</button>
      </div>
      <div id="site" class="site">open the site you want to share</div>
      <button id="send" class="primary">send current session</button>
      <p class="warning">only session state for the active site is sent. use this extension in the dedicated arisa browser profile</p>
    </section>

    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
